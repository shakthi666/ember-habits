name: ember_habits
description: "Ember - a warm, simple habit tracker with streaks, reminders, widget and 39 languages. Offline."
publish_to: "none"
version: 1.1.2+4

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: ^5.2.0
  shared_preferences: ^2.3.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  home_widget: ^0.7.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#7C5CFC"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true
